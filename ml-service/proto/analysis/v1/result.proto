syntax = "proto3";
package autoinspect.analysis.v1;

option go_package = "github.com/DedovInside/AutoInspect/backend/internal/proto/gen/go/analysis/v1;analysisv1";

message AnalysisResult {
  string correlation_id = 1;
  string status = 2;
  string error_message = 3;

  string model_id = 4;
  string model_version = 5;
  string batch_id = 6;
  repeated ImageAnalysisResult results = 7;
}

message ImageAnalysisResult {
  string image_id = 1;
  string image_uri = 2;
  ImageInfo image = 3;
  repeated DamageInstance damage_instances = 4;
  repeated PartSummary parts_summary = 5;
}

message ImageInfo {
  int32 width = 1;
  int32 height = 2;
}

message DamageInstance {
  string id = 1;
  string damage_type = 2;
  repeated Point polygon = 3;
  BBox bbox = 4;
  float confidence = 5;
  repeated PartAssociation parts = 6;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

message BBox {
  int32 x_min = 1;
  int32 y_min = 2;
  int32 x_max = 3;
  int32 y_max = 4;
}

message PartAssociation {
  string name = 1;
  string side = 2;
  float confidence = 3;
}
