version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/repository/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/repository/postgres/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
