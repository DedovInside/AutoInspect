services:
  caddy:
    image: caddy:2-alpine
    container_name: autoinspect-caddy
    environment:
      AUTOINSPECT_API_DOMAIN: ${AUTOINSPECT_API_DOMAIN:-autoinspect-api.duckdns.org}
      AUTOINSPECT_MINIO_DOMAIN: ${AUTOINSPECT_MINIO_DOMAIN:-autoinspect-minio.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: autoinspect-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: autoinspect
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoinspect"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autoinspect-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: autoinspect-kafka
    environment:
      KAFKA_HEAP_OPTS: -Xmx768M -Xms256M
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-sdtnbiMsSymQCRsGFjMjZg}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 20"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: autoinspect-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        cub kafka-ready -b kafka:29092 1 20
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic autoinspect.analysis.request --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic autoinspect.analysis.result --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic autoinspect.analysis.dlq --partitions 1 --replication-factor 1
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: autoinspect-minio
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    command: server /data --console-address ":9001"
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  create-buckets:
    image: minio/mc
    container_name: autoinspect-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint: >
      /bin/sh -c "
      MINIO_USER=$$(cat /run/secrets/minio_root_user);
      MINIO_PASSWORD=$$(cat /run/secrets/minio_root_password);
      mc alias set myminio http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD;
      mc mb myminio/autoinspect-uploads || true;
      mc mb myminio/autoinspect-models || true;
      mc mb myminio/autoinspect-results || true;
      "
    restart: "no"

  migrator:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrator
    container_name: autoinspect-migrator
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - source: database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0440
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: api
    container_name: autoinspect-api
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ISSUER: autoinspect-api
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET_FILE: /run/secrets/yandex_client_secret
      YANDEX_REDIRECT_URL: ${YANDEX_REDIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_ANALYSIS_REQUEST: autoinspect.analysis.request
      KAFKA_TOPIC_ANALYSIS_RESULT: autoinspect.analysis.result
      KAFKA_TOPIC_DLQ: autoinspect.analysis.dlq
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
    secrets:
      - source: database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: jwt_private_key
        target: jwt_private_key
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: jwt_public_key
        target: jwt_public_key
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: yandex_client_secret
        target: yandex_client_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: minio_root_user
        target: minio_root_user
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: minio_root_password
        target: minio_root_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: worker
    container_name: autoinspect-worker
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET_FILE: /run/secrets/yandex_client_secret
      YANDEX_REDIRECT_URL: ${YANDEX_REDIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_ANALYSIS_REQUEST: autoinspect.analysis.request
      KAFKA_TOPIC_ANALYSIS_RESULT: autoinspect.analysis.result
      KAFKA_TOPIC_DLQ: autoinspect.analysis.dlq
      KAFKA_CONSUMER_GROUP_ID: autoinspect-backend
      WORKER_OBSERVABILITY_HOST: 0.0.0.0
      WORKER_OBSERVABILITY_PORT: 8082
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
    secrets:
      - source: database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: jwt_private_key
        target: jwt_private_key
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: jwt_public_key
        target: jwt_public_key
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: yandex_client_secret
        target: yandex_client_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: minio_root_user
        target: minio_root_user
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: minio_root_password
        target: minio_root_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: autoinspect-ml-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_REQUEST_TOPIC: autoinspect.analysis.request
      KAFKA_RESULT_TOPIC: autoinspect.analysis.result
      KAFKA_CONSUMER_GROUP: autoinspect-ml-service
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      S3_BUCKET_UPLOADS: autoinspect-uploads
      S3_BUCKET_MODELS: autoinspect-models
      S3_BUCKET_RESULTS: autoinspect-results
      LOCAL_CACHE_DIR: /cache
      DAMAGE_MODEL_S3_KEY: ${DAMAGE_MODEL_S3_KEY:-models/general/damage_segmentation.pt}
      DAMAGE_CONFIG_S3_KEY: ${DAMAGE_CONFIG_S3_KEY:-models/general/damage_inference_config.json}
      HEALTH_ENABLED: "true"
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8081
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ml_cache:/cache
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: autoinspect-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: autoinspect-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

secrets:
  database_url:
    file: ./secrets/database_url.txt
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  yandex_client_secret:
    file: ./secrets/yandex_client_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  ml_cache:
  loki_data:
